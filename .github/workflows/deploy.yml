name: Auto Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-auto-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Deploy dist to Cloudflare Pages
        id: cf_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4abbcf0a41302c7e08b7293657fe7b08
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set in repository secrets; skipping Cloudflare Pages deploy."
            echo "cf_status=Skipped (missing CLOUDFLARE_API_TOKEN)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes wrangler pages deploy dist --project-name=longhoang --branch=main --commit-hash="${{ github.sha }}"
          echo "cf_status=Deployed (https://longhoang.pages.dev/)" >> "$GITHUB_OUTPUT"

      - name: Publish dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: auto-build from main ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Write Deployment Summary
        if: always()
        run: |
          {
            echo "### Portfolio Build & Dual-Deploy Summary"
            echo ""
            echo "- **Branch**: \`${{ github.ref_name }}\`"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Cloudflare Pages**: ${{ steps.cf_deploy.outputs.cf_status }}"
            echo "- **GitHub Pages**: https://nguyenvanhoanglong478-source.github.io/personal-playground/"
          } >> "$GITHUB_STEP_SUMMARY"
